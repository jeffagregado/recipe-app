name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      e2e_projects:
        description: Playwright projects to run, space separated, or "all" for every project in playwright.config.ts
        default: chromium

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The dev branch of the recipe-app-v2 Neon project; the same target apps/api/test/neon-dev.ts pins locally.
  NEON_PARENT_BRANCH: br-hidden-waterfall-b3dj0mm5
  # The branch a run creates when it has no worktree branch. Unique per run and attempt, so a cancelled run's cleanup can
  # never delete a newer run's branch.
  NEON_RUN_BRANCH: ci/run-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # --affected compares against the base branch and needs its history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Pull requests only run packages the branch touches (and their dependents); master runs everything.
      - name: Lint, typecheck, unit test and build
        run: pnpm exec turbo run lint typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'master' }}

      # The test typecheck reads the contracts build output, which --affected may have skipped.
      - name: Typecheck tests
        run: |
          pnpm exec turbo run build --filter=@recipe-app/contracts
          pnpm run typecheck:tests

  # Git master corresponds to Neon dev: once a merge passes check, dev gets the migrations it brought. Pull request
  # branches and worktree branches are children of dev, so they pick the new schema up when they are created.
  migrate-dev:
    name: Migrate Neon dev
    needs: check
    # Manual runs on master migrate too: one can cancel a push run through the workflow-level group, and would
    # otherwise leave that push's migrations unapplied until the next merge.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    # Drizzle reads the last applied migration before it opens its transaction, so two migrators must never overlap.
    # This group makes a second migrator wait. It cannot stop the workflow-level group from cancelling this job when
    # a newer master run starts, and it does not need to: Drizzle applies all pending migrations in one transaction,
    # so a killed job rolls back to the previous schema and the newer run, which holds the same migrations, applies them.
    concurrency:
      group: migrate-neon-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/neon-connection
        with:
          branch: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      # A no-op when every migration in apps/api/drizzle is already applied.
      - name: Apply migrations
        run: pnpm --filter @recipe/api run db:migrate

  # A merge to master usually pushes a tree its pull request already ran the whole suite on. This job looks for
  # that proof and, only when it finds all of it, tells integration and e2e to skip. Every other outcome, a failed
  # lookup included, leaves the suite to run. check and migrate-dev do not depend on it.
  gate:
    name: Decide whether the suite runs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      suite: ${{ steps.decide.outputs.suite }}
    steps:
      - name: Look for a run that covers this tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          suite=run
          doing="starting"
          reason=""
          covering=""

          # Runs on every exit. A command that failed leaves suite=run, and the job still passes: a broken
          # lookup costs the time of a full run, never a red master.
          report() {
            if [ -z "$reason" ]; then
              reason="the lookup failed while $doing"
              echo "::warning title=Suite gate::$reason; running the full suite"
            fi
            echo "suite=$suite" >> "$GITHUB_OUTPUT"
            {
              if [ "$suite" = skip ]; then
                echo "### Integration and end-to-end skipped"
              else
                echo "### Integration and end-to-end run"
              fi
              echo "- Commit: \`$SHA\`"
              echo "- Reason: $reason"
              if [ -n "$covering" ]; then
                echo "- Covering run: [$covering]($GITHUB_SERVER_URL/$REPO/actions/runs/$covering)"
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          trap report EXIT
          run_suite() { reason=$1; exit 0; }
          api() { gh api -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          doing="reading commit $SHA"
          commit=$(api "repos/$REPO/commits/$SHA")
          tree=$(jq -er '.commit.tree.sha' <<<"$commit")
          parent=$(jq -er '.parents[0].sha' <<<"$commit")

          doing="listing the pull requests of commit $SHA"
          pulls=$(api "repos/$REPO/commits/$SHA/pulls")
          count=$(jq -e 'arrays | length' <<<"$pulls")
          [ "$count" = 1 ] || run_suite "the commit belongs to $count pull requests, and the gate needs exactly one"
          pull=$(jq -er '.[0].number' <<<"$pulls")
          head=$(jq -er '.[0].head.sha' <<<"$pulls")
          target=$(jq -er '.[0].base.ref' <<<"$pulls")
          [ "$target" = master ] || run_suite "pull request #$pull targeted $target, so its runs tested a merge into another branch"

          # Trees, not commits: a squash merge and a merge commit both push a new commit, and either one carries
          # the pull request's tree when the branch was up to date.
          doing="reading the head $head of pull request #$pull"
          head_tree=$(api "repos/$REPO/commits/$head" | jq -er '.commit.tree.sha')
          [ "$tree" = "$head_tree" ] || run_suite "the pushed tree differs from the head of pull request #$pull, so this combination was never tested"

          # A pull request run tests the head merged into master as it was then. That is the head's own tree only
          # when the head already held master, which is certain when it holds the pushed commit's first parent:
          # the master a squash or a merge commit landed on, and every master before it.
          doing="comparing the pushed commit's parent with the head of pull request #$pull"
          merge_base=$(api "repos/$REPO/compare/$parent...$head" | jq -er '.merge_base_commit.sha')
          [ "$merge_base" = "$parent" ] || run_suite "the head of pull request #$pull did not contain master, so its runs tested another tree"

          doing="listing the runs of $head"
          runs=$(api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f event=pull_request -f head_sha="$head" -f status=success -f per_page=100 |
            jq -er --arg head "$head" '[.workflow_runs[] | select(.event == "pull_request" and .head_sha == $head and .status == "completed" and .conclusion == "success") | .id] | join(" ")')

          # A draft's run succeeds with integration and e2e skipped, so the run's conclusion is not enough: each
          # job is checked by the name it has in this file. A renamed job stops matching and the suite runs.
          for run in $runs; do
            doing="listing the jobs of run $run"
            jobs=$(api -X GET "repos/$REPO/actions/runs/$run/jobs" -f filter=latest -f per_page=100)
            if jq -e '
              def green(f): [.jobs[] | select(.name | f)] | length > 0 and all(.conclusion == "success");
              .total_count == (.jobs | length)
              and green(. == "Lint, typecheck, unit tests, build")
              and green(startswith("API integration tests"))
              and green(. == "End-to-end tests")
            ' <<<"$jobs" > /dev/null; then
              suite=skip
              covering=$run
              reason="the pushed tree equals the head of pull request #$pull, and check, every integration shard and end-to-end succeeded on it in run $run"
              exit 0
            fi
          done
          run_suite "no pull request run of $head finished with check, every integration shard and end-to-end successful"

  # Every integration shard and end-to-end test on one Neon branch, so a run uses at most one of the Free plan's ten.
  # A pull request from a worktree tests on that worktree's branch, wt/<head branch>; any other run creates
  # NEON_RUN_BRANCH, which cleanup deletes when the run ends. The branch is migrated here, once, so the test jobs
  # never migrate it at the same time.
  neon:
    name: Prepare the Neon test branch
    needs: gate
    # Beside check rather than after it, so the branch is ready when check passes. The gate and draft rules are the
    # test jobs': a skipped gate on pull request and manual runs leaves an empty output, which runs this job.
    if: ${{ !cancelled() && needs.gate.outputs.suite != 'skip' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    outputs:
      branch: ${{ steps.choose.outputs.branch }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Choose the branch
        id: choose
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # Only a pull request from this repository can have a worktree. Pushes and manual runs always get a branch of
          # their own: they are in another concurrency group, so they could reset a branch a pull request run is testing on.
          WORKTREE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('wt/{0}', github.head_ref) || '' }}
        run: |
          set -euo pipefail
          neon() { pnpm exec neon --no-analytics "$@" --project-id "$NEON_PROJECT_ID"; }
          # The id of the one direct child of dev with this name, or nothing. dev and production are never its children.
          dev_child_id() {
            neon branches list --output json | jq -r --arg name "$1" --arg parent "$NEON_PARENT_BRANCH" \
              '[.[] | select(.name == $name and .id != $parent and .parent_id == $parent) | .id] | if length == 1 then .[0] else "" end'
          }
          branch=""
          if [[ -n "$WORKTREE_BRANCH" ]]; then branch=$(dev_child_id "$WORKTREE_BRANCH"); fi
          if [[ -n "$branch" ]]; then
            # Back to dev's rows and schema, as a new child would start: this drops the worktree's local test data, the
            # migrations of a branch that later regenerated them, and the gap to a dev that moved on. Object storage is
            # not part of a reset, so the worktree's objects stay; every suite deletes the objects it uploads.
            neon branches reset "$branch" --parent > /dev/null
            summary="Tests run on the worktree branch \`$WORKTREE_BRANCH\` ($branch), reset to dev."
          else
            # A run cancelled before cleanup still loses its branch within 3 hours. The longest test job is 45 minutes.
            expires_at=$(date -u -d '+3 hours' +%Y-%m-%dT%H:%M:%SZ)
            neon branches create --name "$NEON_RUN_BRANCH" --parent "$NEON_PARENT_BRANCH" --expires-at "$expires_at" --no-secrets > /dev/null
            branch=$(dev_child_id "$NEON_RUN_BRANCH")
            if [[ -z "$branch" ]]; then echo "::error::The new Neon branch $NEON_RUN_BRANCH was not found."; exit 1; fi
            summary="Tests run on \`$NEON_RUN_BRANCH\` ($branch), created for this run and deleted when it ends."
            if [[ -n "$WORKTREE_BRANCH" ]]; then summary="$summary There is no worktree branch \`$WORKTREE_BRANCH\`."; fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "$summary" | tee -a "$GITHUB_STEP_SUMMARY"

          # The CLI returns once Neon accepts the reset or create, and a migration started before Neon finishes would have
          # its connection cut. Wait until none of the branch's operations is still pending; a failed poll just polls again.
          for _ in $(seq 60); do
            pending=$(curl -sSf -H "Authorization: Bearer $NEON_API_KEY" "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/operations?limit=50" |
              jq --arg branch "$branch" '[.operations[] | select(.branch_id == $branch and (.status | IN("scheduling", "running", "cancelling")))] | length') || pending=""
            if [[ "$pending" == 0 ]]; then exit 0; fi
            sleep 5
          done
          echo "::error::Neon operations on $branch were still running after 5 minutes."
          exit 1

      - uses: ./.github/actions/neon-branch
        with:
          branch: ${{ steps.choose.outputs.branch }}
          parent: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      # A no-op when every migration in apps/api/drizzle is already applied.
      - name: Apply migrations
        run: pnpm --filter @recipe/api run db:migrate

  integration:
    name: API integration tests (${{ matrix.shard }})
    needs: [check, gate, neon]
    # The gate is skipped on pull request and manual runs, and a skipped dependency skips this job unless the
    # condition has a status function. Only the gate's explicit "skip" holds the job back: an empty output,
    # from a skipped or failed gate, runs it.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.neon.result == 'success' && needs.gate.outputs.suite != 'skip' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    # Suites within a shard run serially against a database in another region; unsplit, they took 19 minutes.
    timeout-minutes: 25
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        # Every shard tests on the run's one Neon branch, beside end-to-end, so a suite asserts only on rows, counters
        # and objects it created itself. The named shards each hold 5 to 8 minutes of suites, as run #38518266316
        # timed them. "rest" excludes exactly those files, so a new spec file always runs there without editing this
        # list. When moving a file into a named shard, also add it to `named` in the run step below, or it will run twice.
        include:
          - shard: update
            files: update-recipe.spec
          - shard: create-delete
            files: create-recipe.spec recipe-favorite-delete.spec
          - shard: account
            files: account-email.spec account-password.spec account.spec
          # The Google suites sit here for the timing balance above; nothing requires them to share a shard.
          - shard: auth
            files: auth.spec password-reset.spec google.spec google-connect.spec
          - shard: rest
            files: ""
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build contracts
        run: pnpm exec turbo run build --filter=@recipe-app/contracts

      - uses: ./.github/actions/neon-branch
        with:
          branch: ${{ needs.neon.outputs.branch }}
          parent: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      - name: Run integration tests
        working-directory: apps/api
        run: |
          named="update-recipe.spec create-recipe.spec recipe-favorite-delete.spec account-email.spec account-password.spec
            account.spec auth.spec password-reset.spec google.spec google-connect.spec"
          args=()
          if [ -n "$SHARD_FILES" ]; then
            for file in $SHARD_FILES; do args+=("$file"); done
          else
            for file in $named; do args+=(--exclude "**/$file.ts"); done
          fi
          pnpm exec vitest run --config vitest.integration.config.ts "${args[@]}"
        env:
          SHARD_FILES: ${{ matrix.files }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:4101
          # AWS_ENDPOINT_URL_S3 is the run's storage, exported by the Neon branch step; a value here would override it.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}

  e2e:
    name: End-to-end tests
    needs: [check, gate, neon]
    # The gate is skipped on pull request and manual runs, and a skipped dependency skips this job unless the
    # condition has a status function. Only the gate's explicit "skip" holds the job back: an empty output,
    # from a skipped or failed gate, runs it.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.neon.result == 'success' && needs.gate.outputs.suite != 'skip' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      E2E_PROJECTS: ${{ inputs.e2e_projects || 'chromium' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Before the build: the web app only optimizes recipe photos from RECIPE_STORAGE_HOST, which this step exports
      # for the run's own storage. The build and the server Playwright starts both read it from the job environment.
      - uses: ./.github/actions/neon-branch
        with:
          branch: ${{ needs.neon.outputs.branch }}
          parent: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      - name: Build
        run: pnpm build

      # Chromium is the gate: it passed every spec on the first CI run, while mobile-webkit failed 22, some of them
      # for reasons in the specs themselves (unsupported mouse.wheel, Chromium-only error text). The other projects
      # run on demand through "Run workflow" until they are known to pass.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps ${{ env.E2E_PROJECTS == 'chromium' && 'chromium' || '' }}

      - name: Run Playwright
        run: |
          projects=()
          if [ "$E2E_PROJECTS" != "all" ]; then
            for project in $E2E_PROJECTS; do projects+=("--project=$project"); done
          fi
          pnpm exec playwright test "${projects[@]}"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:4101
          # AWS_ENDPOINT_URL_S3 is this run's own storage, exported by the Neon branch step; a value here would override it.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}

      # The repository is public, and so is this artifact. Only the screenshots are clean: the error-context.md files
      # beside them hold the page's form values, a typed password included, and can quote a signed photo URL.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  # The live demo site (issue #112) end to end: the API and a web build with DEMO_MODE on, and the one journey in
  # e2e/*.demo.ts. It waits for integration rather than running beside it: the API demo suite's busy test briefly fills
  # every live Demo account slot on the run's Neon branch, and a demo started then is answered busy. e2e starts no demo,
  # so it stays beside integration. Like e2e, it runs whatever integration's result.
  e2e-demo:
    name: End-to-end tests (demo)
    needs: [check, gate, neon, integration]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.neon.result == 'success' && needs.gate.outputs.suite != 'skip' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/neon-branch
        with:
          branch: ${{ needs.neon.outputs.branch }}
          parent: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      # The demo start page and the auth redirects are fixed at build time.
      - name: Build
        run: pnpm build
        env:
          DEMO_MODE: 'true'

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm exec playwright test --config playwright.demo.config.ts
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:4101
          # AWS_ENDPOINT_URL_S3 is this run's own storage, exported by the Neon branch step; a value here would override it.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}

      # PNG files only, for the reason given at e2e's upload.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-demo-failure-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  # Deletes NEON_RUN_BRANCH once the test jobs have ended, whether they passed, failed or were cancelled. A worktree
  # branch is never deleted here: it stays for the worktree until the cleanup after its merge.
  cleanup:
    name: Delete the run's Neon branch
    needs: [neon, integration, e2e, e2e-demo]
    if: ${{ always() && needs.neon.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    steps:
      # The Neon API directly, so the job needs no checkout or install and starts at once.
      - name: Delete the branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          branches_api() { curl -sSf -H "Authorization: Bearer $NEON_API_KEY" "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches$1" "${@:2}"; }
          branch=$(branches_api "" | jq -r --arg name "$NEON_RUN_BRANCH" --arg parent "$NEON_PARENT_BRANCH" \
            '[.branches[] | select(.name == $name and .id != $parent and .parent_id == $parent) | .id] | if length == 1 then .[0] else "" end')
          if [[ -z "$branch" ]]; then
            echo "No branch $NEON_RUN_BRANCH to delete: this run tested on a worktree branch or created none."
            exit 0
          fi
          # Neon refuses the delete while an operation on the branch is still running, such as a compute suspending.
          for _ in $(seq 12); do
            if branches_api "/$branch" -X DELETE > /dev/null; then echo "Deleted $NEON_RUN_BRANCH ($branch)."; exit 0; fi
            sleep 10
          done
          echo "::warning::Could not delete $NEON_RUN_BRANCH ($branch); it expires 3 hours after it was created."
