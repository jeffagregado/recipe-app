name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      e2e_projects:
        description: Playwright projects to run, space separated, or "all" for every project in playwright.config.ts
        default: chromium

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The dev branch of the recipe-app-v2 Neon project; the same target apps/api/test/neon-dev.ts pins locally.
  NEON_PARENT_BRANCH: br-hidden-waterfall-b3dj0mm5
  # Unique per run and attempt, so a cancelled run's cleanup can never delete a newer run's branch.
  NEON_BRANCH_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # --affected compares against the base branch and needs its history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Pull requests only run packages the branch touches (and their dependents); master runs everything.
      - name: Lint, typecheck, unit test and build
        run: pnpm exec turbo run lint typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'master' }}

      # The test typecheck reads the contracts build output, which --affected may have skipped.
      - name: Typecheck tests
        run: |
          pnpm exec turbo run build --filter=@recipe-app/contracts
          pnpm run typecheck:tests

  # Git master corresponds to Neon dev: once a merge passes check, dev gets the migrations it brought. Pull request
  # branches and worktree branches are children of dev, so they pick the new schema up when they are created.
  migrate-dev:
    name: Migrate Neon dev
    needs: check
    # Manual runs on master migrate too: one can cancel a push run through the workflow-level group, and would
    # otherwise leave that push's migrations unapplied until the next merge.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    # Drizzle reads the last applied migration before it opens its transaction, so two migrators must never overlap.
    # This group makes a second migrator wait. It cannot stop the workflow-level group from cancelling this job when
    # a newer master run starts, and it does not need to: Drizzle applies all pending migrations in one transaction,
    # so a killed job rolls back to the previous schema and the newer run, which holds the same migrations, applies them.
    concurrency:
      group: migrate-neon-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/neon-connection
        with:
          branch: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      # A no-op when every migration in apps/api/drizzle is already applied.
      - name: Apply migrations
        run: pnpm --filter @recipe/api run db:migrate

  integration:
    name: API integration tests (${{ matrix.shard }})
    needs: check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Suites within a shard run serially against a database in another region; unsplit, they took 19 minutes.
    timeout-minutes: 25
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        # Each shard gets its own Neon branch, so shards cannot disturb each other's count assertions.
        # The two named shards hold the slowest suites. "rest" excludes exactly those files, so a new
        # spec file always runs there without editing this list. When moving a file into a named shard,
        # also add it to `named` in the run step below, or it will run twice.
        # storage.spec is one test that idles for a minute; it rides in "update", the shortest shard.
        include:
          - shard: update
            files: update-recipe.spec storage.spec
          - shard: create-delete
            files: create-recipe.spec recipe-favorite-delete.spec
          - shard: rest
            files: ""
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build contracts
        run: pnpm exec turbo run build --filter=@recipe-app/contracts

      - uses: ./.github/actions/neon-branch
        with:
          name: ci/integration-${{ matrix.shard }}-${{ env.NEON_BRANCH_SUFFIX }}
          parent: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations
        run: pnpm --filter @recipe/api run db:migrate

      - name: Run integration tests
        working-directory: apps/api
        run: |
          named="update-recipe.spec storage.spec create-recipe.spec recipe-favorite-delete.spec"
          args=()
          if [ -n "$SHARD_FILES" ]; then
            for file in $SHARD_FILES; do args+=("$file"); done
          else
            for file in $named; do args+=(--exclude "**/$file.ts"); done
          fi
          pnpm exec vitest run --config vitest.integration.config.ts "${args[@]}"
        env:
          SHARD_FILES: ${{ matrix.files }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:4101
          # AWS_ENDPOINT_URL_S3 is this shard's own storage, exported by the Neon branch step; a value here would override it.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}

      - name: Delete database branch
        if: always()
        run: pnpm exec neon --no-analytics branches delete "ci/integration-$SHARD-$NEON_BRANCH_SUFFIX" --project-id "$NEON_PROJECT_ID" || true
        env:
          SHARD: ${{ matrix.shard }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

  e2e:
    name: End-to-end tests
    needs: check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      E2E_PROJECTS: ${{ inputs.e2e_projects || 'chromium' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Before the build: the web app only optimizes recipe photos from RECIPE_STORAGE_HOST, which this step exports
      # for the run's own storage. The build and the server Playwright starts both read it from the job environment.
      - uses: ./.github/actions/neon-branch
        with:
          name: ci/e2e-${{ env.NEON_BRANCH_SUFFIX }}
          parent: ${{ env.NEON_PARENT_BRANCH }}
          project-id: ${{ vars.NEON_PROJECT_ID }}
          api-key: ${{ secrets.NEON_API_KEY }}

      - name: Build
        run: pnpm build

      # Chromium is the gate: it passed every spec on the first CI run, while mobile-webkit failed 22, some of them
      # for reasons in the specs themselves (unsupported mouse.wheel, Chromium-only error text). The other projects
      # run on demand through "Run workflow" until they are known to pass.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps ${{ env.E2E_PROJECTS == 'chromium' && 'chromium' || '' }}

      - name: Apply migrations
        run: pnpm --filter @recipe/api run db:migrate

      - name: Run Playwright
        run: |
          projects=()
          if [ "$E2E_PROJECTS" != "all" ]; then
            for project in $E2E_PROJECTS; do projects+=("--project=$project"); done
          fi
          pnpm exec playwright test "${projects[@]}"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:4101
          # AWS_ENDPOINT_URL_S3 is this run's own storage, exported by the Neon branch step; a value here would override it.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}

      # The repository is public, and so is this artifact. Only the screenshots are clean: the error-context.md files
      # beside them hold the page's form values, a typed password included, and can quote a signed photo URL.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Delete database branch
        if: always()
        run: pnpm exec neon --no-analytics branches delete "ci/e2e-$NEON_BRANCH_SUFFIX" --project-id "$NEON_PROJECT_ID" || true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
