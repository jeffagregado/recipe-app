packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Nest CLI's optional SWC compiler is not used by the Vite-based tests.
  '@swc/core': false
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@next/env@16.4.0"
  - "@next/eslint-plugin-next@16.4.0"
  - "@next/swc-darwin-arm64@16.4.0"
  - "@next/swc-darwin-x64@16.4.0"
  - "@next/swc-linux-arm64-gnu@16.4.0"
  - "@next/swc-linux-arm64-musl@16.4.0"
  - "@next/swc-linux-x64-gnu@16.4.0"
  - "@next/swc-linux-x64-musl@16.4.0"
  - "@next/swc-win32-arm64-msvc@16.4.0"
  - "@next/swc-win32-x64-msvc@16.4.0"
  - eslint-config-next@16.4.0
  - next@16.4.0
  - "@fallow-cli/darwin-arm64@3.32.0"
  - "@fallow-cli/darwin-x64@3.32.0"
  - "@fallow-cli/linux-arm64-gnu@3.32.0"
  - "@fallow-cli/linux-arm64-musl@3.32.0"
  - "@fallow-cli/linux-x64-gnu@3.32.0"
  - "@fallow-cli/linux-x64-musl@3.32.0"
  - "@fallow-cli/win32-arm64-msvc@3.32.0"
  - "@fallow-cli/win32-x64-msvc@3.32.0"
  - fallow-type-aware@3.32.0
  - fallow@3.32.0
